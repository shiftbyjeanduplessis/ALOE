name: Perfect Women visual inspection

on:
  push:
    branches: [perfect-women-ui-v2]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static preview exactly like Render
        run: |
          rm -rf public
          mkdir -p public/assets public/downloads
          cp perfect-women-start-here/index.html public/index.html
          for f in perfect-women-start-here/asset_sources/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d -i "$f" > "public/assets/$name" || true
          done
          if compgen -G "perfect-women-start-here/source_assets/*.b64" > /dev/null; then
            for f in perfect-women-start-here/source_assets/*.b64; do
              name=$(basename "$f" .b64)
              base64 -d -i "$f" > "public/assets/$name" || true
            done
          fi
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture Start Here, app screens and QA time machine
        run: |
          python3 -m http.server 4173 --directory public >/tmp/pw-http.log 2>&1 &
          cat > inspect.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch();
            const results=[];
            fs.mkdirSync('artifacts',{recursive:true});
            async function basePage(viewport){
              const context=await browser.newContext({viewport,locale:'en-ZA',timezoneId:'Africa/Johannesburg'});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              return {context,page,errors};
            }
            async function snap(name,page,errors,status=200){
              await page.screenshot({path:`artifacts/${name}.png`,fullPage:true});
              const metrics=await page.evaluate(()=>({title:document.title,width:document.documentElement.scrollWidth,innerWidth:innerWidth,screen:[...document.querySelectorAll('.screen')].find(x=>getComputedStyle(x).display!=='none')?.id||'',bodyText:document.body.innerText.slice(0,3000),bg:getComputedStyle(document.body).backgroundColor,shell:!!document.querySelector('.shell'),nav:!!document.querySelector('.nav'),hero:!!document.querySelector('.hero'),qa:!!document.querySelector('#pwQaPanel')}));
              results.push({name,status,errors:[...errors],metrics});
            }
            async function simple(name,url,viewport){
              const {context,page,errors}=await basePage(viewport);
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              await snap(name,page,errors,response&&response.status());
              await context.close();
            }
            async function appTour(){
              const {context,page,errors}=await basePage({width:390,height:844});
              const response=await page.goto('http://127.0.0.1:4173/assets/app-page.html?cohort=2026-09-14',{waitUntil:'networkidle',timeout:30000});
              await snap('app-mobile-home',page,errors,response&&response.status());
              await page.locator('[data-screen="exercise"]').click();
              await page.waitForTimeout(100);
              await snap('app-mobile-exercise',page,errors);
              await page.locator('[data-screen="diary"]').click();
              await page.waitForTimeout(100);
              await snap('app-mobile-diary',page,errors);
              await page.locator('[data-screen="progress"]').click();
              await page.waitForTimeout(100);
              await snap('app-mobile-progress',page,errors);
              await context.close();
            }
            async function qaTour(){
              const {context,page,errors}=await basePage({width:390,height:844});
              const response=await page.goto('http://127.0.0.1:4173/assets/app-page.html?cohort=2026-09-14&qa=1',{waitUntil:'networkidle',timeout:30000});
              await page.locator('#pwQaPanel').waitFor({state:'attached'});
              await page.locator('#qatab').click();
              await page.locator('#qatr').selectOption('gym');
              await page.locator('#qaw').selectOption('1');
              await page.locator('#qad').selectOption('1');
              await page.locator('#qaex').click();
              await page.waitForTimeout(100);
              let body=await page.locator('body').innerText();
              if(!body.includes('Basic Gym')) throw new Error('QA Basic Gym selection did not render');
              await snap('qa-week1-basic-gym',page,errors,response&&response.status());
              await page.locator('#qatr').selectOption('home');
              await page.locator('#qanx').click();
              await page.waitForTimeout(100);
              body=await page.locator('body').innerText();
              if(!body.includes('Home Dumbbell')) throw new Error('QA Home Dumbbell cycle did not render');
              await snap('qa-next-home-workout',page,errors);
              await page.locator('#qatr').selectOption('run');
              await page.locator('#qaw').selectOption('8');
              await page.locator('#qad').selectOption('2');
              await page.waitForTimeout(100);
              body=await page.locator('body').innerText();
              if(!body.includes('Walking & Running')) throw new Error('QA Walking & Running selection did not render');
              await snap('qa-week8-walking-running',page,errors);
              await page.locator('#qalaunch').click();
              await page.waitForTimeout(100);
              await snap('qa-sunday-launch',page,errors);
              await context.close();
            }
            await simple('start-desktop','http://127.0.0.1:4173/',{width:1365,height:768});
            await simple('start-mobile','http://127.0.0.1:4173/',{width:390,height:844});
            await simple('app-desktop-home','http://127.0.0.1:4173/assets/app-page.html?cohort=2026-09-14',{width:1365,height:768});
            await appTour();
            await qaTour();
            fs.writeFileSync('artifacts/inspection.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if(results.some(r=>r.status!==200 || r.errors.length || r.metrics.width>r.metrics.innerWidth+2 || !r.metrics.shell)) process.exitCode=1;
            await browser.close();
          })();
          NODE
          node inspect.js
      - name: Upload visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-women-visual-inspection
          path: artifacts/
