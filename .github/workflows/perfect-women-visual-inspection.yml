name: Perfect Women visual inspection

on:
  push:
    branches: [perfect-women-ui-v2]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static preview exactly like Render
        run: |
          rm -rf public
          mkdir -p public/assets public/downloads
          cp perfect-women-start-here/index.html public/index.html
          for f in perfect-women-start-here/asset_sources/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d -i "$f" > "public/assets/$name" || true
          done
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture Start Here and app
        run: |
          python3 -m http.server 4173 --directory public >/tmp/pw-http.log 2>&1 &
          cat > inspect.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch();
            const results=[];
            async function inspect(name,url,viewport){
              const page=await browser.newPage({viewportSize:viewport, locale:'en-ZA', timezoneId:'Africa/Johannesburg'});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
              page.on('pageerror',e=>errors.push('pageerror: '+e.message));
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              await page.screenshot({path:`artifacts/${name}.png`,fullPage:true});
              const metrics=await page.evaluate(()=>({
                title:document.title,
                width:document.documentElement.scrollWidth,
                innerWidth:innerWidth,
                bodyText:document.body.innerText.slice(0,1800),
                bg:getComputedStyle(document.body).backgroundColor,
                shell:!!document.querySelector('.shell'),
                nav:!!document.querySelector('.nav'),
                hero:!!document.querySelector('.hero'),
                homeText:(document.querySelector('#home')||{}).innerText||''
              }));
              results.push({name,status:response&&response.status(),errors,metrics});
              await page.close();
            }
            fs.mkdirSync('artifacts',{recursive:true});
            await inspect('start-desktop','http://127.0.0.1:4173/',{width:1365,height:768});
            await inspect('start-mobile','http://127.0.0.1:4173/',{width:390,height:844});
            await inspect('app-desktop','http://127.0.0.1:4173/assets/app-page.html?cohort=2026-09-14',{width:1365,height:768});
            await inspect('app-mobile','http://127.0.0.1:4173/assets/app-page.html?cohort=2026-09-14',{width:390,height:844});
            fs.writeFileSync('artifacts/inspection.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if(results.some(r=>r.status!==200 || r.errors.length || r.metrics.width>r.metrics.innerWidth+2)) process.exitCode=1;
            await browser.close();
          })();
          NODE
          node inspect.js
      - name: Upload visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-women-visual-inspection
          path: artifacts/
