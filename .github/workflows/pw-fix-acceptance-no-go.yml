name: Perfect Women focused acceptance fixes

on:
  push:
    branches: [perfect-women-start-here]
    paths:
      - '.github/workflows/pw-fix-acceptance-no-go.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perfect-women-start-here
      - name: Add release-fix patch
        run: |
          cat > perfect-women-start-here/dev_sources/pw-release-fixes-v6.js <<'EOF'
          (function(){
          'use strict';
          if(window.__PW_RELEASE_FIXES_V6__) return;
          window.__PW_RELEASE_FIXES_V6__=true;

          const QA_KEY='pw8v4-qa-date-v2';
          const PLAN_META={
            gym:'4 strength sessions · 35–45 min',
            home:'4 home sessions · 20 min max',
            run:'4 sessions · 20–40 min'
          };

          function fixUndefinedHome(){
            const home=document.getElementById('home');
            if(!home) return;
            home.querySelectorAll('.v3cta span').forEach(el=>{
              if((el.textContent||'').trim()==='undefined'){
                const k=(window.S&&S.track)||'';
                el.textContent=PLAN_META[k]||'';
              }
            });
            const walker=document.createTreeWalker(home,NodeFilter.SHOW_TEXT);
            const bad=[];
            while(walker.nextNode()){
              if((walker.currentNode.nodeValue||'').trim()==='undefined') bad.push(walker.currentNode);
            }
            bad.forEach(n=>n.nodeValue='');
          }

          function fixTimedPlank(){
            const modal=document.getElementById('pwSequenceModal');
            if(!modal) return;
            const h=modal.querySelector('.pw-ex-card h1');
            if(!h || (h.textContent||'').trim()!=='Standard Plank') return;
            const card=h.closest('.pw-ex-card');
            if(!card) return;
            const ps=[...card.querySelectorAll('p')];
            const prescription=ps.find(p=>(p.textContent||'').includes('target 30–45 sec'));
            if(prescription){
              prescription.innerHTML=prescription.innerHTML
                .replace(/2 sets × 12 reps · target 30–45 sec/g,'2 sets × 30–45 sec')
                .replace(/2–3 sets × 12 reps · target 30–45 sec/g,'2–3 sets × 30–45 sec')
                .replace(/3 sets × 12 reps · target 30–45 sec/g,'3 sets × 30–45 sec');
              const last=prescription.querySelector('span');
              if(last){
                last.textContent=last.textContent.replace(/Last logged:\s*—\s*×\s*([0-9.]+)/,'Last logged: $1 sec');
              }
            }
          }

          function observeUi(){
            const home=document.getElementById('home');
            if(home){
              new MutationObserver(()=>fixUndefinedHome()).observe(home,{subtree:true,childList:true,characterData:true});
            }
            new MutationObserver(()=>fixTimedPlank()).observe(document.body,{subtree:true,childList:true});
            fixUndefinedHome();
            fixTimedPlank();
          }

          function installQaPersistence(){
            if(new URLSearchParams(location.search).get('qa')!=='1') {
              try{sessionStorage.removeItem(QA_KEY)}catch(e){}
              return;
            }
            const panel=document.getElementById('pwQaPanel');
            if(!panel) return;
            const W=panel.querySelector('#qaw'),D=panel.querySelector('#qad');
            if(!W||!D) return;

            function write(obj){
              try{sessionStorage.setItem(QA_KEY,JSON.stringify(obj))}catch(e){}
            }
            function read(){
              try{return JSON.parse(sessionStorage.getItem(QA_KEY)||'null')}catch(e){return null}
            }
            function capture(){
              write({mode:'date',w:+W.value||0,d:+D.value||1});
            }
            function later(fn){setTimeout(fn,0)}

            W.addEventListener('change',()=>later(capture));
            D.addEventListener('change',()=>later(capture));
            ['qap','qan','qawp','qanx'].forEach(id=>{
              const b=panel.querySelector('#'+id);
              if(b)b.addEventListener('click',()=>later(capture));
            });
            const prep=panel.querySelector('#qaprep');
            if(prep)prep.addEventListener('click',()=>later(()=>write({mode:'prep'})));
            const launch=panel.querySelector('#qalaunch');
            if(launch)launch.addEventListener('click',()=>later(()=>write({mode:'launch'})));
            const real=panel.querySelector('#qareal');
            if(real)real.addEventListener('click',()=>{try{sessionStorage.removeItem(QA_KEY)}catch(e){}});
            const restore=panel.querySelector('#qares');
            if(restore)restore.addEventListener('click',()=>{try{sessionStorage.removeItem(QA_KEY)}catch(e){}});

            const saved=read();
            if(!saved) return;
            setTimeout(()=>{
              if(saved.mode==='launch'){
                const b=panel.querySelector('#qalaunch'); if(b)b.click();
              }else if(saved.mode==='prep'){
                const b=panel.querySelector('#qaprep'); if(b)b.click();
              }else if(saved.mode==='date' && saved.w>=0){
                W.value=String(saved.w);
                D.value=String(saved.d||1);
                W.dispatchEvent(new Event('change',{bubbles:true}));
              }
            },0);
          }

          observeUi();
          installQaPersistence();
          })();
          EOF
          node --check perfect-women-start-here/dev_sources/pw-release-fixes-v6.js
          base64 -w0 perfect-women-start-here/dev_sources/pw-release-fixes-v6.js > perfect-women-start-here/asset_sources/pw-release-fixes-v6.b64
      - name: Wire fix into app boot
        run: |
          cat > perfect-women-start-here/dev_sources/app-page-v3.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08a8b5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Perfect Women"><link rel="manifest" href="/assets/manifest.json"><title>Perfect Women</title><link rel="stylesheet" href="/assets/pw-v4.css"><link rel="stylesheet" href="/assets/pw-ui-upgrade.css"><link rel="stylesheet" href="/assets/pw-ui-v3.css"><link rel="stylesheet" href="/assets/pw-training-v4.css"><link rel="stylesheet" href="/assets/pw-training-sequence-v5.css"></head><body><div class="shell"><header class="top"><div class="brandline"><div class="brand"><strong>PERFECT WOMEN</strong><span>Let's Do It Together</span></div><div class="status"><span class="pill" id="cohortPill">14 Sep</span><span class="pill" id="weekPill">Prep</span></div></div></header><main class="content"><section class="screen on" id="home"></section><section class="screen" id="exercise"></section><section class="screen" id="diary"></section><section class="screen" id="progress"></section></main><nav class="nav"><button class="on" data-screen="home"><span class="ni">⌂</span>Home</button><button data-screen="exercise"><span class="ni">◉</span>Exercise</button><button data-screen="diary"><span class="ni">✎</span>Diary</button><button data-screen="progress"><span class="ni">↗</span>Progress</button></nav></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet"><div class="sheetbar"></div><div class="sheethead"><h2>Choose your exercise plan</h2><button class="close" id="closeModal">×</button></div><div class="choice-grid" id="trackChoices"></div></div></div><script>Promise.all(['/assets/pw-v4.part1','/assets/pw-v4.part2','/assets/pw-v4.part3','/assets/pw-v4.part4a','/assets/pw-v4.part4b','/assets/pw-v4-fix.part5','/assets/pw-v4-polish.part6','/assets/pw-ui-v3.part7','/assets/pw-training-v4','/assets/pw-training-sequence-v5','/assets/pw-release-fixes-v6'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()}))).then(p=>(0,eval)(p.join(''))).catch(e=>{document.body.innerHTML='<div style="padding:24px;font-family:Arial;color:#075568"><h2>Perfect Women</h2><p>App failed to load. Please refresh.</p></div>';console.error(e)})</script></body></html>
          EOF
          base64 -w0 perfect-women-start-here/dev_sources/app-page-v3.html > perfect-women-start-here/asset_sources/app-page.html.b64
          grep -q "pw-release-fixes-v6" perfect-women-start-here/dev_sources/app-page-v3.html
      - name: Bump service worker cache
        run: |
          cat > perfect-women-start-here/dev_sources/sw-v3.js <<'EOF'
          const C='pw8-v6-1';
          const A=['/assets/app-page.html','/assets/pw-v4.css','/assets/pw-ui-upgrade.css','/assets/pw-ui-v3.css','/assets/pw-training-v4.css','/assets/pw-training-sequence-v5.css','/assets/pw-v4.part1','/assets/pw-v4.part2','/assets/pw-v4.part3','/assets/pw-v4.part4a','/assets/pw-v4.part4b','/assets/pw-v4-fix.part5','/assets/pw-v4-polish.part6','/assets/pw-ui-v3.part7','/assets/pw-training-v4','/assets/pw-training-sequence-v5','/assets/pw-release-fixes-v6','/assets/manifest.json'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(A)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{let x=r.clone();caches.open(C).then(c=>c.put(e.request,x));return r}).catch(()=>caches.match(e.request)))});
          EOF
          node --check perfect-women-start-here/dev_sources/sw-v3.js
          base64 -w0 perfect-women-start-here/dev_sources/sw-v3.js > perfect-women-start-here/asset_sources/sw.js.b64
      - name: Static focused checks
        run: |
          grep -q "sessionStorage.setItem(QA_KEY" perfect-women-start-here/dev_sources/pw-release-fixes-v6.js
          grep -q "2 sets × 30–45 sec" perfect-women-start-here/dev_sources/pw-release-fixes-v6.js
          grep -q "PLAN_META" perfect-women-start-here/dev_sources/pw-release-fixes-v6.js
          base64 -d perfect-women-start-here/asset_sources/app-page.html.b64 | grep -q "pw-release-fixes-v6"
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perfect-women-start-here/dev_sources/pw-release-fixes-v6.js perfect-women-start-here/dev_sources/app-page-v3.html perfect-women-start-here/dev_sources/sw-v3.js perfect-women-start-here/asset_sources/pw-release-fixes-v6.b64 perfect-women-start-here/asset_sources/app-page.html.b64 perfect-women-start-here/asset_sources/sw.js.b64
          git commit -m 'Fix QA date persistence plank timing and home undefined'
          git push origin HEAD:perfect-women-start-here
