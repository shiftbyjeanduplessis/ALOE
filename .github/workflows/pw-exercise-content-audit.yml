name: Perfect Women exercise content audit

on:
  push:
    branches: [perfect-women-ui-v2]
    paths:
      - '.github/workflows/pw-exercise-content-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perfect-women-ui-v2
      - name: Install PDF and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Clone authoritative Perfect Women PDFs
        run: git clone --depth=1 https://github.com/shiftbyjeanduplessis/PERFECTWOMEN.git /tmp/pw-source
      - name: Extract authoritative program text, image inventory and page OCR
        run: |
          set -e
          mkdir -p perfect-women-start-here/audit/ocr/basic-gym perfect-women-start-here/audit/ocr/home-dumbbell perfect-women-start-here/audit/ocr/walking-running perfect-women-start-here/audit/tsv/basic-gym perfect-women-start-here/audit/tsv/home-dumbbell
          GYM='/tmp/pw-source/downloads/05 - Perfect Women - Basic Gym Program.pdf'
          HOME='/tmp/pw-source/downloads/06 - Perfect Women - Home Dumbbell Program.pdf'
          RUN='/tmp/pw-source/downloads/07 - Perfect Women - Walking and Running Program.pdf'
          pdfinfo "$GYM" > perfect-women-start-here/audit/basic-gym-info.txt
          pdftotext -layout "$GYM" perfect-women-start-here/audit/basic-gym.txt
          pdfimages -list "$GYM" > perfect-women-start-here/audit/basic-gym-images.txt
          pdfinfo "$HOME" > perfect-women-start-here/audit/home-dumbbell-info.txt
          pdftotext -layout "$HOME" perfect-women-start-here/audit/home-dumbbell.txt
          pdfimages -list "$HOME" > perfect-women-start-here/audit/home-dumbbell-images.txt
          pdfinfo "$RUN" > perfect-women-start-here/audit/walking-running-info.txt
          pdftotext -layout "$RUN" perfect-women-start-here/audit/walking-running.txt
          pdfimages -list "$RUN" > perfect-women-start-here/audit/walking-running-images.txt
          mkdir -p /tmp/gym-pages /tmp/home-pages /tmp/run-pages
          pdftoppm -jpeg -r 180 "$GYM" /tmp/gym-pages/page >/dev/null 2>&1
          pdftoppm -jpeg -r 180 "$HOME" /tmp/home-pages/page >/dev/null 2>&1
          pdftoppm -jpeg -r 180 "$RUN" /tmp/run-pages/page >/dev/null 2>&1
          for f in /tmp/gym-pages/*.jpg; do n=$(basename "$f" .jpg); tesseract "$f" "perfect-women-start-here/audit/ocr/basic-gym/$n" -l eng --psm 6 >/dev/null 2>&1 || true; done
          for f in /tmp/home-pages/*.jpg; do n=$(basename "$f" .jpg); tesseract "$f" "perfect-women-start-here/audit/ocr/home-dumbbell/$n" -l eng --psm 6 >/dev/null 2>&1 || true; done
          for f in /tmp/run-pages/*.jpg; do n=$(basename "$f" .jpg); tesseract "$f" "perfect-women-start-here/audit/ocr/walking-running/$n" -l eng --psm 6 >/dev/null 2>&1 || true; done
          for p in 06 07 08 09; do
            tesseract "/tmp/gym-pages/page-$p.jpg" stdout -l eng --psm 11 tsv > "perfect-women-start-here/audit/tsv/basic-gym/page-$p.tsv" 2>/dev/null || true
            tesseract "/tmp/home-pages/page-$p.jpg" stdout -l eng --psm 11 tsv > "perfect-women-start-here/audit/tsv/home-dumbbell/page-$p.tsv" 2>/dev/null || true
          done
          {
            for f in perfect-women-start-here/audit/ocr/basic-gym/page-*.txt; do echo "===== $(basename "$f") ====="; cat "$f"; echo; done
          } > perfect-women-start-here/audit/basic-gym-ocr-all.txt
          {
            for f in perfect-women-start-here/audit/ocr/home-dumbbell/page-*.txt; do echo "===== $(basename "$f") ====="; cat "$f"; echo; done
          } > perfect-women-start-here/audit/home-dumbbell-ocr-all.txt
          {
            for f in perfect-women-start-here/audit/ocr/walking-running/page-*.txt; do echo "===== $(basename "$f") ====="; cat "$f"; echo; done
          } > perfect-women-start-here/audit/walking-running-ocr-all.txt
      - name: Commit audit text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perfect-women-start-here/audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add exercise-page OCR coordinates to audit'
          git push origin HEAD:perfect-women-ui-v2
