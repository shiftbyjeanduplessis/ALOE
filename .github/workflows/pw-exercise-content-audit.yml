name: Perfect Women exercise content audit

on:
  push:
    branches: [perfect-women-ui-v2]
    paths:
      - '.github/workflows/pw-exercise-content-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perfect-women-ui-v2
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Clone authoritative Perfect Women PDFs
        run: git clone --depth=1 https://github.com/shiftbyjeanduplessis/PERFECTWOMEN.git /tmp/pw-source
      - name: Extract authoritative program text and image inventory
        run: |
          mkdir -p perfect-women-start-here/audit
          GYM='/tmp/pw-source/downloads/05 - Perfect Women - Basic Gym Program.pdf'
          HOME='/tmp/pw-source/downloads/06 - Perfect Women - Home Dumbbell Program.pdf'
          RUN='/tmp/pw-source/downloads/07 - Perfect Women - Walking and Running Program.pdf'
          pdfinfo "$GYM" > perfect-women-start-here/audit/basic-gym-info.txt
          pdftotext -layout "$GYM" perfect-women-start-here/audit/basic-gym.txt
          pdfimages -list "$GYM" > perfect-women-start-here/audit/basic-gym-images.txt
          pdfinfo "$HOME" > perfect-women-start-here/audit/home-dumbbell-info.txt
          pdftotext -layout "$HOME" perfect-women-start-here/audit/home-dumbbell.txt
          pdfimages -list "$HOME" > perfect-women-start-here/audit/home-dumbbell-images.txt
          pdfinfo "$RUN" > perfect-women-start-here/audit/walking-running-info.txt
          pdftotext -layout "$RUN" perfect-women-start-here/audit/walking-running.txt
          pdfimages -list "$RUN" > perfect-women-start-here/audit/walking-running-images.txt
      - name: Commit audit text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perfect-women-start-here/audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract authoritative exercise program audit text'
          git push origin HEAD:perfect-women-ui-v2
