name: Perfect Women exercise guide assets

on:
  push:
    branches: [perfect-women-ui-v2]
    paths:
      - '.github/workflows/pw-exercise-guide-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perfect-women-ui-v2
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Clone authoritative PDFs
        run: git clone --depth=1 https://github.com/shiftbyjeanduplessis/PERFECTWOMEN.git /tmp/pw-source
      - name: Render strength program guide pages
        run: |
          set -e
          GYM='/tmp/pw-source/downloads/05 - Perfect Women - Basic Gym Program.pdf'
          HOME='/tmp/pw-source/downloads/06 - Perfect Women - Home Dumbbell Program.pdf'
          mkdir -p /tmp/gym /tmp/home perfect-women-start-here/asset_sources
          pdftoppm -f 6 -l 12 -jpeg -r 110 "$GYM" /tmp/gym/gym >/dev/null 2>&1
          pdftoppm -f 6 -l 12 -jpeg -r 110 "$HOME" /tmp/home/home >/dev/null 2>&1
          i=6
          for f in /tmp/gym/*.jpg; do printf -v n '%02d' "$i"; base64 -w0 "$f" > "perfect-women-start-here/asset_sources/pw-gym-page-$n.jpg.b64"; i=$((i+1)); done
          i=6
          for f in /tmp/home/*.jpg; do printf -v n '%02d' "$i"; base64 -w0 "$f" > "perfect-women-start-here/asset_sources/pw-home-page-$n.jpg.b64"; i=$((i+1)); done
      - name: Commit rendered guide assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perfect-women-start-here/asset_sources/pw-gym-page-*.jpg.b64 perfect-women-start-here/asset_sources/pw-home-page-*.jpg.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add approved exercise guide page assets'
          git push origin HEAD:perfect-women-ui-v2
