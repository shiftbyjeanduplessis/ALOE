name: Perfect Women add Home HIIT

on:
  push:
    branches: [perfect-women-start-here]
    paths:
      - 'scripts/pw_add_home_hiit.py'
      - '.github/workflows/pw-add-home-hiit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perfect-women-start-here
      - name: Apply Home HIIT patch
        run: python scripts/pw_add_home_hiit.py
      - name: Syntax checks
        run: |
          node --check perfect-women-start-here/dev_sources/pw-training-sequence-v5.js
          node --check perfect-women-start-here/dev_sources/pw-ui-v3.part7.js
          node --check perfect-women-start-here/dev_sources/pw-release-fixes-v6.js
      - name: Commit Home HIIT
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perfect-women-start-here/dev_sources/pw-training-sequence-v5.js perfect-women-start-here/asset_sources/pw-training-sequence-v5.b64 perfect-women-start-here/dev_sources/pw-ui-v3.part7.js perfect-women-start-here/asset_sources/pw-ui-v3.part7.b64 perfect-women-start-here/dev_sources/pw-release-fixes-v6.js perfect-women-start-here/asset_sources/pw-release-fixes-v6.b64 perfect-women-start-here/dev_sources/pw-training-sequence-v5.css perfect-women-start-here/asset_sources/pw-training-sequence-v5.css.b64 perfect-women-start-here/dev_sources/sw-v3.js perfect-women-start-here/asset_sources/sw.js.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Home HIIT as fourth sequential exercise program'
          git push origin HEAD:perfect-women-start-here
